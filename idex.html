<!DOCTYPE html>
<html lang="bg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мениджър на Студенти (CRUD)</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h1>📚 Мениджър на Студенти</h1>

        <section class="form-section">
            <h2>Добави/Редактирай Студент</h2>
            <form id="student-form">
                <input type="hidden" id="student-id">
                
                <input type="text" id="name" placeholder="Име" required>
                
                <div class="input-group"> <input 
                        type="number" 
                        id="fn" 
                        placeholder="Факултетен № (10 цифри)" 
                        required
                    >
                    <p id="fn-error" class="error-message"></p> 
                </div>
                
                <input type="number" id="grade" placeholder="Оценка (2.00-6.00)" min="2" max="6" step="0.01" required>
                
                <button type="submit" id="submit-btn">Добави Студент</button>
            </form>
        </section>

        <section class="list-section">
            <h2>Списък със Студенти</h2>
            <div class="controls">
                <input type="text" id="search-input" placeholder="Търсене по Име или ФН...">
                <label for="sort-by">Сортирай по:</label>
                <select id="sort-by">
                    <option value="name-asc">Име (A-Z)</option>
                    <option value="name-desc">Име (Z-A)</option>
                    <option value="grade-desc">Оценка (Висша)</option>
                    <option value="grade-asc">Оценка (Нисша)</option>
                    <option value="fn-asc">ФН (Възкач.)</option>
                </select>
            </div>
            
            <table id="student-table">
                <thead>
                    <tr>
                        <th>Име</th>
                        <th>ФН</th>
                        <th>Оценка</th>
                        <th>Действия</th>
                    </tr>
                </thead>
                <tbody id="student-list">
                    </tbody>
            </table>

            <p id="empty-message" style="text-align: center; color: #aaa;">Няма добавени студенти.</p>
        </section>
    </div>

    <script src="script.js"></script>
</body>
</html>
